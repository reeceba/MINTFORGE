<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090c"><title>MINTFORGE — Orders</title><style>:root{--bg:#08090c;--card:#111318;--line:#252932;--text:#f6f7fb;--muted:#9298a5;--accent:#9dff00;--red:#ff7373}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:18px 5%;border-bottom:1px solid var(--line);position:sticky;top:0;background:#08090cf5;backdrop-filter:blur(14px);z-index:5}.logo{font-weight:900;letter-spacing:.1em;font-size:21px}.logo span{color:var(--accent)}button{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.connect,.save{background:var(--accent);color:#071000}.wrap{max-width:1180px;margin:auto;padding:28px 5% 80px}.muted{color:var(--muted)}.login{max-width:520px;margin:70px auto;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px}.login h1{margin:5px 0 10px}.eyebrow{color:var(--accent);font-size:11px;font-weight:850;letter-spacing:.14em;text-transform:uppercase}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.stat b{font-size:25px;display:block}.order{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin:14px 0}.top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.order h3{margin:4px 0}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#20242c;font-size:11px;font-weight:800}.paid{color:var(--accent)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px}.box{background:#0b0d11;border:1px solid var(--line);border-radius:14px;padding:14px}.box h4{margin:0 0 8px}.field{margin:8px 0}.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;background:#08090c;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:10px;font:inherit}.field textarea{min-height:70px;resize:vertical}.actions{display:flex;gap:9px;align-items:center;margin-top:12px}.save{min-width:150px}.notice{color:var(--muted);font-size:12px;white-space:pre-wrap}.error{color:var(--red)}.empty{text-align:center;padding:60px 20px;color:var(--muted)}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.top{flex-direction:column}}
</style></head><body><header><div class="logo">MINT<span>FORGE</span></div><button class="connect" id="connect">CONNECT ADMIN WALLET</button></header><main class="wrap"><section id="login" class="login"><div class="eyebrow">PRIVATE ADMIN</div><h1>Orders dashboard</h1><p class="muted">Connect the MINTFORGE receiving wallet. You will sign a short access message; no SOL is sent.</p><button class="connect" id="loginBtn">CONNECT & SIGN</button><p id="loginStatus" class="notice"></p></section><section id="dashboard" style="display:none"><div class="eyebrow">FULFILMENT</div><h1>Orders</h1><p class="muted">Manage paid orders, shipping details and tracking.</p><div class="stats"><div class="stat"><span class="muted">Total</span><b id="statTotal">0</b></div><div class="stat"><span class="muted">Paid</span><b id="statPaid">0</b></div><div class="stat"><span class="muted">Unfulfilled</span><b id="statUnfulfilled">0</b></div><div class="stat"><span class="muted">Shipped</span><b id="statShipped">0</b></div></div><div id="orders"></div></section></main><script type="module">import bs58 from 'https://esm.sh/bs58@6.0.0';const SUPABASE_URL='https://zezusfnbqvijldhxoejd.supabase.co',ADMIN=SUPABASE_URL+'/functions/v1/admin-orders-v1',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJ6ZXp1c2ZuYnF2aWqldHxvZ2VqZCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzg3Njg1MTk5LCJleHAiOjIxMDMyNjExOTl9.Ohise8STwhPr9un939eb27';let wallet=null,signature=null,orders=[];const $=id=>document.getElementById(id);function provider(){return window.solflare?.isSolflare?window.solflare:(window.solana?.isSolflare?window.solana:null)}function date(){return new Date().toISOString().slice(0,10)}function message(w,d){return `MINTFORGE ADMIN ACCESS\nWallet: ${w}\nDate: ${d}`}async function connectAdmin(){const p=provider();if(!p)throw Error('Open the site inside Solflare.');const r=await p.connect();wallet=(r?.publicKey||p.publicKey).toString();if(!p.signMessage)throw Error('This wallet does not support message signing.');const bytes=new TextEncoder().encode(message(wallet,date()));const out=await p.signMessage(bytes,'utf8');const raw=out?.signature||out;signature=bs58.encode(raw);return wallet}async function api(action,extra={}){const r=await fetch(ADMIN,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},body:JSON.stringify({action,wallet,signature,...extra})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Admin request failed');return d}async function login(){try{$('loginStatus').textContent='Connecting and requesting a signature…';await connectAdmin();await load();$('login').style.display='none';$('dashboard').style.display='block';$('connect').textContent='ADMIN CONNECTED'}catch(e){$('loginStatus').className='notice error';$('loginStatus').textContent=e.message||String(e)}}async function load(){const d=await api('list');orders=d.orders||[];render()}function money(v){return '$'+Number(v||0).toFixed(2)+' AUD'}function render(){const paid=orders.filter(o=>o.status==='Paid'),un=orders.filter(o=>o.fulfilment_status==='Unfulfilled'),sh=orders.filter(o=>o.fulfilment_status==='Shipped');$('statTotal').textContent=orders.length;$('statPaid').textContent=paid.length;$('statUnfulfilled').textContent=un.length;$('statShipped').textContent=sh.length;if(!orders.length){$('orders').innerHTML='<div class="empty">No orders yet.</div>';return}$('orders').innerHTML=orders.map(o=>{const no='MF-'+o.id.slice(0,8).toUpperCase();return `<article class="order"><div class="top"><div><div class="eyebrow">${no}</div><h3>${escapeHtml(o.product_name||'Order')}</h3><div class="muted">${new Date(o.created_at).toLocaleString()} · ${money(o.amount)}</div></div><div><span class="pill paid">${o.status}${o.payment_verified?' ✓':''}</span> <span class="pill">${o.fulfilment_status}</span></div></div><div class="grid"><div class="box"><h4>Customer & shipping</h4><div><b>${escapeHtml(o.shipping_name||'')}</b></div><div>${escapeHtml(o.customer_email||'')}</div><div style="margin-top:8px">${escapeHtml(o.shipping_address||'')}<br>${escapeHtml(o.shipping_city||'')}, ${escapeHtml(o.shipping_state||'')} ${escapeHtml(o.shipping_postcode||'')}<br>${escapeHtml(o.shipping_country||'')}</div></div><div class="box"><h4>Payment</h4><div>${escapeHtml(o.payment_currency||'SOL')} · ${money(o.amount)}</div><div class="muted" style="margin-top:6px;word-break:break-all">${escapeHtml(o.payment_tx_signature||'')}</div><div class="muted" style="margin-top:6px">Email: ${o.confirmation_email_sent_at?'Sent ✓':'Not sent'}</div></div></div><div class="grid"><div class="box"><h4>Fulfilment</h4><div class="field"><label>STATUS</label><select id="status-${o.id}"><option ${o.fulfilment_status==='Unfulfilled'?'selected':''}>Unfulfilled</option><option ${o.fulfilment_status==='Processing'?'selected':''}>Processing</option><option ${o.fulfilment_status==='Shipped'?'selected':''}>Shipped</option><option ${o.fulfilment_status==='Delivered'?'selected':''}>Delivered</option><option ${o.fulfilment_status==='Cancelled'?'selected':''}>Cancelled</option></select></div><div class="field"><label>SHIPPING CARRIER</label><input id="carrier-${o.id}" value="${escapeAttr(o.shipping_carrier||'')}" placeholder="Australia Post"></div><div class="field"><label>TRACKING NUMBER</label><input id="tracking-${o.id}" value="${escapeAttr(o.tracking_number||'')}" placeholder="Tracking number"></div></div><div class="box"><h4>Notes</h4><div class="field"><label>FULFILMENT NOTES</label><textarea id="notes-${o.id}" placeholder="Packing notes, print status, customer notes…">${escapeHtml(o.fulfilment_notes||'')}</textarea></div></div></div><div class="actions"><button class="save" onclick="saveOrder('${o.id}')">SAVE ORDER</button><span id="notice-${o.id}" class="notice"></span></div></article>`}).join('')}function escapeHtml(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function escapeAttr(v){return escapeHtml(v).replace(/\n/g,' ')}window.saveOrder=async id=>{const n=$('notice-'+id);try{n.className='notice';n.textContent='Saving…';const d=await api('update',{order_id:id,fulfilment_status:$('status-'+id).value,shipping_carrier:$('carrier-'+id).value,tracking_number:$('tracking-'+id).value,fulfilment_notes:$('notes-'+id).value});n.className='notice';n.textContent='Saved ✓';const idx=orders.findIndex(x=>x.id===id);if(idx>=0)orders[idx]=d.order;render()}catch(e){n.className='notice error';n.textContent=e.message||String(e)}};$('loginBtn').onclick=login;$('connect').onclick=login;</script></body></html>
