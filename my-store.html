<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MINTFORGE — My Store</title><style>body{margin:0;background:#08090c;color:#fff;font-family:Inter,system-ui,sans-serif}.wrap{padding:20px;max-width:1100px;margin:auto}.panel,.card{background:#111318;border:1px solid #252932;border-radius:16px;padding:18px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field{margin:7px 0}.field label{display:block;font-size:10px;color:#9298a5;font-weight:800}.input,.select,.area{width:100%;box-sizing:border-box;background:#08090c;border:1px solid #252932;color:#fff;border-radius:9px;padding:10px;margin-top:5px}.area{min-height:80px}.btn{border:0;border-radius:10px;padding:10px 14px;background:#20242c;color:#fff;font-weight:850}.primary{background:#9dff00;color:#071000}.muted{color:#9298a5;font-size:13px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.shipping{border-top:1px solid #252932;margin-top:14px;padding-top:14px}.status{font-size:12px;color:#9298a5;margin-top:8px}.error{color:#ff7373}.success{color:#9dff00}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="row"><div><h1>My Store</h1><p class="muted">Your connected wallet owns these listings and receives their payments.</p></div><button id="new" class="btn primary">+ NEW LISTING</button></div><div id="status" class="status"></div><section id="form" class="panel" style="display:none"><h2 id="formTitle">Create listing</h2><div class="grid"><div class="field"><label>PRODUCT NAME</label><input id="name" class="input"></div><div class="field"><label>PRICE (AUD)</label><input id="price" class="input" type="number" min="0" step="0.01"></div><div class="field"><label>STOCK</label><input id="stock" class="input" type="number" min="0"></div><div class="field"><label>SKU</label><input id="sku" class="input"></div><div class="field"><label>CATEGORY</label><input id="category" class="input" value="3D Print"></div><div class="field"><label>WEIGHT (GRAMS)</label><input id="weight" class="input" type="number" min="0"></div><div class="field" style="grid-column:1/-1"><label>DESCRIPTION</label><textarea id="description" class="area"></textarea></div><div class="field"><label>IMAGE URL</label><input id="image" class="input"></div><div class="field"><label>STATUS</label><select id="statusSelect" class="select"><option>Draft</option><option>Live</option></select></div></div><div class="shipping"><h3>Shipping</h3><div class="grid"><div class="field"><label>SHIPPING</label><select id="shipMode" class="select"><option value="free">Free shipping</option><option value="flat">Flat-rate shipping</option><option value="weight">Weight-based (coming next)</option></select></div><div class="field"><label>SHIPPING PRICE (AUD)</label><input id="shipPrice" class="input" type="number" min="0" step="0.01" value="0"></div></div><p class="muted">For V1, flat-rate shipping is charged once per product in the cart. Weight-based shipping is reserved for the next shipping engine.</p></div><button id="save" class="btn primary">SAVE LISTING</button><button id="cancel" class="btn">CANCEL</button></section><section><h2>Listings</h2><div id="list"></div></section></main><script>const F='https://zezusfnbqvijldhxoejd.supabase.co/functions/v1/seller-dashboard',P='https://zezusfnbqvijldhxoejd.supabase.co/functions/v1/wallet-profile',K='sb_publishable_ax8du05SKISdpJQkXb3Ulw_0YJKQTjz';let token=sessionStorage.getItem('mintforge_account_session')||sessionStorage.getItem('mintforge_seller_session'),items=[],editing=null;const $=x=>document.getElementById(x);async function api(action,extra={}){const r=await fetch(F,{method:'POST',headers:{'Content-Type':'application/json','apikey':K,'Authorization':'Bearer '+K},body:JSON.stringify({action,session_token:token,...extra})});const d=await r.json();if(!r.ok)throw Error(d.error||'Store request failed');return d}async function load(){if(!token){$('status').className='status error';$('status').textContent='Connect your wallet first.';return}try{const d=await api('overview');items=d.products||[];render()}catch(e){$('status').className='status error';$('status').textContent=e.message}}function render(){$('list').innerHTML=items.length?items.map(p=>`<article class="card"><div class="row"><div><b>${esc(p.name)}</b><div class="muted">$${Number(p.price).toFixed(2)} AUD · ${p.stock} stock · ${p.status}</div><div class="muted">Shipping: ${p.shipping_mode==='flat'?'$'+Number(p.shipping_price||0).toFixed(2)+' AUD flat':p.shipping_mode==='weight'?'Weight-based':'FREE'}</div></div><button class="btn" onclick="edit('${p.id}')">EDIT</button></div></article>`).join(''):'<p class="muted">No listings yet.</p>'}function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function clear(){editing=null;$('form').style.display='none';['name','price','stock','sku','category','weight','description','image'].forEach(x=>$(x).value='');$('shipMode').value='free';$('shipPrice').value='0';$('statusSelect').value='Draft'}window.edit=id=>{const p=items.find(x=>x.id===id);if(!p)return;editing=id;$('formTitle').textContent='Edit listing';for(const [k,id2] of Object.entries({name:'name',price:'price',stock:'stock',sku:'sku',category:'category',weight_grams:'weight',description:'description',image_url:'image'}))$(id2).value=p[k]??'';$('shipMode').value=p.shipping_mode||'free';$('shipPrice').value=p.shipping_price||0;$('statusSelect').value=p.status||'Draft';$('form').style.display='block';window.scrollTo({top:0,behavior:'smooth'})};$('new').onclick=()=>{clear();$('formTitle').textContent='Create listing';$('form').style.display='block'};$('cancel').onclick=clear;$('save').onclick=async()=>{try{$('save').disabled=true;const p={name:$('name').value.trim(),price:Number($('price').value),stock:Number($('stock').value),sku:$('sku').value.trim(),category:$('category').value.trim(),weight_grams:Number($('weight').value||0),description:$('description').value.trim(),image_url:$('image').value.trim(),status:$('statusSelect').value,shipping_required:true,shipping_mode:$('shipMode').value,shipping_price:Number($('shipPrice').value||0)};if(editing)await api('update_product',{product_id:editing,product:p});else await api('create_product',{product:p});$('status').className='status success';$('status').textContent='Listing saved ✓';clear();await load()}catch(e){$('status').className='status error';$('status').textContent=e.message}finally{$('save').disabled=false}};load();</script></body></html>
