name: Deploy MINTFORGE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply worldwide shipping UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<label>STATE</label><select id="shipState"><option value="">Select</option><option>QLD</option><option>NSW</option><option>VIC</option><option>SA</option><option>WA</option><option>TAS</option><option>NT</option><option>ACT</option></select>','<label>STATE / PROVINCE / REGION</label><input id="shipState" autocomplete="address-level1" placeholder="State / province / region">')
          s=s.replace('<label>POSTCODE</label><input id="shipPostcode" inputmode="numeric" maxlength="4">','<label>POSTAL / ZIP CODE</label><input id="shipPostcode" autocomplete="postal-code">')
          s=s.replace('<label>COUNTRY</label><select id="shipCountry"><option>Australia</option></select>','<label>COUNTRY</label><select id="shipCountry"></select>')
          s=s.replace('<label>STATE</label><select id="profileState"><option value="">Select</option><option>QLD</option><option>NSW</option><option>VIC</option><option>SA</option><option>WA</option><option>TAS</option><option>NT</option><option>ACT</option></select>','<label>STATE / PROVINCE / REGION</label><input id="profileState" autocomplete="address-level1" placeholder="State / province / region">')
          s=s.replace('<label>POSTCODE</label><input id="profilePostcode" inputmode="numeric" maxlength="4">','<label>POSTAL / ZIP CODE</label><input id="profilePostcode" autocomplete="postal-code">')
          s=s.replace('<label>COUNTRY</label><select id="profileCountry"><option>Australia</option></select>','<label>COUNTRY</label><select id="profileCountry"></select>')
          marker='function fillShipping(p){'
          insert="""const WORLD_COUNTRY_CODES=`AF AL DZ AS AD AO AI AQ AG AR AM AW AU AT AZ BS BH BD BB BY BE BZ BJ BM BT BO BQ BA BW BV BR IO BN BG BF BI CV KH CM CA KY CF TD CL CN CX CC CO KM CG CD CK CR CI HR CU CW CY CZ DK DJ DM DO EC EG SV GQ ER EE SZ ET FK FO FJ FI FR GF PF TF GA GM GE DE GH GI GR GL GD GP GU GT GG GN GW GY HT HM VA HN HK HU IS IN ID IR IQ IE IM IL IT JM JP JE JO KZ KE KI KP KR KW KG LA LV LB LS LR LY LI LT LU MO MG MW MY MV ML MT MH MQ MR MU YT MX FM MD MC MN ME MS MA MZ MM NA NR NP NL NC NZ NI NE NG NU NF MK MP NO OM PK PW PS PA PG PY PE PH PN PL PT PR QA RE RO RU RW BL SH KN LC MF PM VC WS SM ST SA SN RS SC SL SG SX SK SI SB SO ZA GS SS ES LK SD SR SJ SE CH SY TW TJ TZ TH TL TG TK TO TT TN TR TM TC TV UG UA AE GB US UM UY UZ VU VE VN VG VI WF EH YE ZM ZW`.split(' ');
function initWorldwideShipping(){const names=new Intl.DisplayNames(['en'],{type:'region'});for(const id of ['shipCountry','profileCountry']){const el=$(id);if(!el)continue;const current=el.value||'Australia';el.innerHTML=WORLD_COUNTRY_CODES.map(c=>{const n=names.of(c)||c;return `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`}).join('');el.value=[...el.options].some(o=>o.value===current)?current:'Australia';}}

"""
          s=s.replace(marker,insert+marker,1)
          s=s.replace("country:'Australia'", "country:$('profileCountry').value||'Australia'", 1)
          s=s.replace("country:'Australia'},email=$('shipEmail').value.trim();", "country:$('shipCountry').value||'Australia'},email=$('shipEmail').value.trim();")
          s=s.replace("if(!s.name||!email||!s.address||!s.city||!s.state||!/^[0-9]{4}$/.test(s.postcode)){alert('Please complete your Australian shipping details and email.');return}", "if(!s.name||!email||!s.address||!s.city||!s.country||!s.postcode){alert('Please complete your international shipping details and email.');return}")
          s=s.replace('loadProducts();renderCart();','initWorldwideShipping();loadProducts();renderCart();')
          p.write_text(s)
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
