name: Apply phone image upload
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch listing image upload
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<div class="field"><label>IMAGE URL</label><input id="listingImage"></div>'
          new='''<div class="field"><label>PRODUCT IMAGE</label><input id="listingImageFile" type="file" accept="image/*" capture="environment"><div id="listingImagePreview" class="note" style="margin-top:8px">Choose a photo from your phone.</div><input id="listingImage" type="hidden"></div>'''
          if old not in s: raise SystemExit('image field not found')
          s=s.replace(old,new,1)
          marker='function clearListingForm(){'
          patch='''async function mfReadListingImage(){const f=document.getElementById('listingImageFile')?.files?.[0];if(!f)return;const preview=document.getElementById('listingImagePreview');preview.textContent='Preparing image…';const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});const img=await new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=data});const max=1200,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);const compressed=c.toDataURL('image/jpeg',.84);document.getElementById('listingImage').value=compressed;preview.innerHTML='<span class="success">Photo ready ✓</span> <span class="muted">'+Math.round(compressed.length/1024)+' KB</span>';}
          function mfSetupListingImage(){const input=document.getElementById('listingImageFile');if(!input||input.dataset.mfReady)return;input.dataset.mfReady='1';input.addEventListener('change',()=>mfReadListingImage().catch(e=>{document.getElementById('listingImagePreview').innerHTML='<span class="error">Could not read image.</span>'}));}
          function mfResetListingImage(){const f=document.getElementById('listingImageFile'),p=document.getElementById('listingImagePreview'),h=document.getElementById('listingImage');if(f)f.value='';if(h)h.value='';if(p)p.textContent='Choose a photo from your phone.';mfSetupListingImage();}
          '''
          if marker not in s: raise SystemExit('clearListingForm marker not found')
          s=s.replace(marker,patch+marker,1)
          s=s.replace("$('listingImage').value='';$('listingShippingMode').value='free';", "$('listingImage').value='';mfResetListingImage();$('listingShippingMode').value='free';",1)
          s=s.replace("$('listingImage').value=p.image_url||'';$('listingShippingMode').value=shippingStrategy(p);", "$('listingImage').value=p.image_url||'';mfSetupListingImage();$('listingImagePreview').innerHTML=p.image_url?'<span class=\"success\">Current image loaded ✓</span>':'Choose a photo from your phone.';$('listingShippingMode').value=shippingStrategy(p);",1)
          s=s.replace("$('saveListing').disabled=true;const strategy=", "$('saveListing').disabled=true;await mfReadListingImage();const strategy=",1)
          s=s.replace("$('closeSellerOrderBtn').onclick=closeSellerOrder;", "$('closeSellerOrderBtn').onclick=closeSellerOrder;mfSetupListingImage();",1)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name 'MINTFORGE Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore phone image upload for listings'
          git push
