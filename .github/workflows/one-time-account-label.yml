name: MINTFORGE account label cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename profile button to account
        run: |
          if grep -q '>MY PROFILE<' index.html; then
            sed -i 's/>MY PROFILE</>MY ACCOUNT</g' index.html
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Polish homepage account navigation'
            git push
          fi
          rm -f .github/workflows/one-time-account-label.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove one-time account label workflow' || true
          git push || true
