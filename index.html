<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090c"><title>MINTFORGE — Solana Commerce</title><style>:root{--bg:#08090c;--card:#111318;--line:#252932;--text:#f6f7fb;--muted:#9298a5;--accent:#9dff00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}header{display:flex;justify-content:space-between;align-items:center;padding:18px 5%;border-bottom:1px solid var(--line);position:sticky;top:0;background:#08090cf5;backdrop-filter:blur(14px);z-index:5}.logo{font-weight:900;letter-spacing:.1em;font-size:21px}.logo span{color:var(--accent)}button{border:0;border-radius:12px;padding:11px 15px;font-weight:800;cursor:pointer}.connect,.pay{background:var(--accent);color:#070900}.wrap{max-width:1200px;margin:auto;padding:34px 5% 100px}.eyebrow{color:var(--accent);font-weight:850;letter-spacing:.14em;text-transform:uppercase;font-size:11px}h1{font-size:clamp(40px,7vw,76px);line-height:.92;margin:12px 0}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:linear-gradient(145deg,#151820,#0e1015);border:1px solid var(--line);border-radius:20px;overflow:hidden}.art{height:180px;display:grid;place-items:center;background:radial-gradient(circle,#263500,#10130d 55%,#0c0e12);font-size:62px}.body{padding:18px}.body h3{margin:6px 0 7px;font-size:20px}.body p{min-height:38px;font-size:14px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.buy{background:#fff;color:#08090c}.stock{font-size:11px;color:var(--muted);margin-top:8px}.cart{position:fixed;right:18px;bottom:18px;width:min(400px,calc(100% - 36px));background:#111318;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 20px 60px #000b;display:none;z-index:10}.cart.open{display:block}.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.qty{display:flex;align-items:center;gap:6px}.qty button{padding:4px 9px;border-radius:8px;background:#20242c;color:#fff}.remove{background:transparent!important;color:#ff7373!important;padding:4px}.pay{width:100%;margin-top:15px}.status{margin-top:10px;color:var(--muted);font-size:12px;white-space:pre-wrap}.sig{word-break:break-all}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}header{padding:15px 4%}}</style></head><body><header><div class="logo">MINT<span>FORGE</span></div><button class="connect" id="connect">CONNECT SOLFLARE</button></header><main class="wrap"><div class="eyebrow">SOLANA • 3D PRINTS • WEB3</div><h1>PHYSICAL GOODS.<br>ON-CHAIN PAYMENTS.</h1><p class="muted">Web3-native commerce for physical collectibles.</p><p class="muted" id="wallet">Wallet not connected</p><div class="eyebrow">SHOP</div><h2>Featured products</h2><div class="grid" id="products"></div></main><div class="cart" id="cart"><h3>Your cart</h3><div id="items"></div><div class="row"><b>Total</b><b id="total">$0.00 USD</b></div><button class="pay" id="checkout">CHECKOUT WITH SOL</button><div class="status" id="status"></div></div><script type="module">window.__web3Promise=import('https://esm.sh/@solana/web3.js@1.95.8?standalone').then(m=>{window.solanaWeb3=m;return m}).catch(e=>{window.__web3Error=e;throw e});</script><script>const SUPABASE_URL='https://zezusfnbqvijldhxoejd.supabase.co',STORE=SUPABASE_URL+'/functions/v1/storefront-public',CHECKOUT=SUPABASE_URL+'/functions/v1/create-checkout-v2',SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplenVzZm5icXZpamxkaHhvZWpkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2ODUxOTksImV4cCI6MjEwMzI2MTE5OX0.Ohise8STwhPr9un939mZ8iY46uQEEedMGQLMX85HaR8';let products=[{id:'70084fbe-1b85-480f-8092-0ab706894853',name:'MINTFORGE Test Print',description:'$1 dummy product for checkout testing only.',price:1,stock:100,category:'TEST PRODUCT'},{id:'bdb64445-d505-4320-a378-71775053c6cc',name:'Solana Gecko',description:'MINTFORGE collectible 3D print.',price:35,stock:12,category:'3D PRINT'},{id:'8b1b62be-a3bf-410e-b436-0ffd952a5ac7',name:'MINTFORGE Keychain',description:'Compact Web3 collectible keychain.',price:18,stock:28,category:'KEYCHAIN'}],cart=[],wallet=null,$=id=>document.getElementById(id);function render(){productsEl.innerHTML=products.map(p=>`<article class="card"><div class="art">${p.name.includes('Gecko')?'🦎':p.name.includes('Keychain')?'🔑':'🧪'}</div><div class="body"><div class="eyebrow">${p.category||'3D PRINT'}</div><h3>${p.name}</h3><p class="muted">${p.description||''}</p><div class="row"><b>$${Number(p.price).toFixed(2)} USD</b><button class="buy" onclick="add('${p.id}')">ADD TO CART</button></div><div class="stock">${p.stock} in stock</div></div></article>`).join('')}function add(id){const p=products.find(x=>x.id===id),x=cart.find(x=>x.id===id);if(x)x.q=Math.min(x.q+1,p.stock);else cart.push({id,name:p.name,price:+p.price,q:1,stock:p.stock});draw()}function change(id,d){const x=cart.find(x=>x.id===id);if(!x)return;x.q=Math.max(0,Math.min(x.q+d,x.stock));if(!x.q)cart=cart.filter(y=>y.id!==id);draw()}function removeItem(id){cart=cart.filter(x=>x.id!==id);draw()}function draw(){$('cart').classList.toggle('open',cart.length>0);$('items').innerHTML=cart.map(x=>`<div class="item"><span><strong>${x.name}</strong><br><span class="qty"><button onclick="change('${x.id}',-1)">−</button>${x.q}<button onclick="change('${x.id}',1)">+</button><button class="remove" onclick="removeItem('${x.id}')">Remove</button></span></span><b>$${(x.price*x.q).toFixed(2)}</b></div>`).join('');$('total').textContent='$'+cart.reduce((a,x)=>a+x.price*x.q,0).toFixed(2)+' USD'}async function connect(){const p=window.solflare?.isSolflare?window.solflare:(window.solana?.isSolflare?window.solana:window.solana);if(!p){alert('Open this HTTPS site inside Solflare.');return}try{const r=await p.connect();wallet=(r&&r.publicKey?r.publicKey:p.publicKey).toString();$('wallet').textContent='Connected: '+wallet.slice(0,6)+'…'+wallet.slice(-6);$('connect').textContent='CONNECTED'}catch(e){$('status').textContent=e.message}}$('connect').onclick=connect;$('checkout').onclick=async()=>{if(!wallet){await connect();if(!wallet)return}if(!cart.length)return;$('status').textContent='Loading Solana transaction engine…';try{const web3=window.solanaWeb3||await window.__web3Promise;if(!web3)throw Error('Solana transaction engine unavailable');$('status').textContent='Creating secure checkout…';const r=await fetch(CHECKOUT,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY},body:JSON.stringify({items:cart.map(x=>({product_id:x.id,quantity:x.q})),wallet_address:wallet,shipping:{country:'Australia'},payment_currency:'SOL'})}),d=await r.json();if(!r.ok)throw Error(d.error||'Checkout failed');const o=d.order;if(!o?.expected_amount||!o?.payment_recipient)throw Error('Invalid payment quote returned');$('status').textContent='Order created.\nAmount: '+o.expected_amount+' SOL\nRecipient: '+o.payment_recipient+'\nOpening Solflare…';const provider=window.solflare?.isSolflare?window.solflare:window.solana;if(!provider)throw Error('Solflare provider unavailable');const connection=new web3.Connection('https://api.mainnet-beta.solana.com','confirmed'),from=new web3.PublicKey(wallet),to=new web3.PublicKey(o.payment_recipient);const tx=new web3.Transaction().add(web3.SystemProgram.transfer({fromPubkey:from,toPubkey:to,lamports:Math.round(Number(o.expected_amount)*1e9)}));tx.feePayer=from;tx.recentBlockhash=(await connection.getLatestBlockhash('confirmed')).blockhash;const result=await provider.signAndSendTransaction(tx);const sig=result.signature||result;await connection.confirmTransaction(sig,'confirmed');$('status').innerHTML='PAYMENT CONFIRMED ✓\nOrder: '+o.id+'\nSignature:\n<span class="sig">'+sig+'</span>';cart=[];draw()}catch(e){$('status').textContent='Checkout failed: '+(e?.message||e)}};const productsEl=$('products');render();(async()=>{try{const r=await fetch(STORE,{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});if(r.ok){const d=await r.json();if(d.products?.length){products=d.products;render()}}}catch(e){}})();</script></body></html>
